
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StackSmart | IKU Hackathon</title>

  <style>
    /* CSS: Controls how the app looks */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fc;
      color: #202b42;
    }

    header {
      background: #273a80;
      color: white;
      padding: 22px;
    }

    header h1 { margin: 0 0 6px; }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 15px;
      background: white;
    }

    button {
      background: #4259bd;
      color: white;
      border: 0;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      margin: 3px;
    }

    button:hover { background: #273a80; }

    main {
      max-width: 1050px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px #202b4210;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    .stat {
      font-size: 28px;
      font-weight: bold;
      color: #334cbd;
    }

    input, select, textarea {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 9px 0;
      border: 1px solid #ccd3e3;
      border-radius: 8px;
      font: inherit;
    }

    textarea { min-height: 110px; }

    .muted { color: #69758a; }

    .item {
      padding: 10px 0;
      border-bottom: 1px solid #e8eaf0;
    }

    .progress {
      background: #e5e9f3;
      height: 14px;
      border-radius: 8px;
      overflow: hidden;
    }

    .fill {
      background: #43b89c;
      height: 100%;
    }

    a { color: #334cbd; }
  </style>
</head>

<body>

  <!-- HTML: The visible app structure -->
  <header>
    <h1>💸 StackSmart</h1>
    <p>Your money, your friends, less chaos.</p>
  </header>

  <nav id="navigation"></nav>
  <main id="app"></main>

  <script>
    // JAVASCRIPT: Makes the website interactive

    // 1. Store information in the browser
    const initialData = {
      budget: 500,
      transactions: [],
      savings: [],
      groups: [],
      bills: [],
      skills: []
    };

    let data;

    try {
      data = JSON.parse(localStorage.getItem("stacksmart"));
    } catch {
      data = null;
    }

    if (!data || typeof data !== "object") {
      data = structuredClone(initialData);
    }

    for (const key of Object.keys(initialData)) {
      if (!(key in data)) {
        data[key] = structuredClone(initialData[key]);
      }
    }

    function save() {
      localStorage.setItem("stacksmart", JSON.stringify(data));
    }

    function money(number) {
      return "£" + Number(number).toFixed(2);
    }

    // Prevent user-entered text from becoming HTML code
    function safe(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[character]));
    }

    function validAmount(value) {
      const amount = Number(value);
      return Number.isFinite(amount) && amount > 0;
    }

    const pages = [
      ["Dashboard", "dashboard"],
      ["Budget", "budget"],
      ["Grocery Deals", "groceries"],
      ["Travel Deals", "travel"],
      ["Holiday Savings", "holidays"],
      ["Groups & Flatmates", "groups"],
      ["Bills", "bills"],
      ["Skill Swap", "skills"],
      ["Smart Assistant", "assistant"]
    ];

    document.getElementById("navigation").innerHTML =
      pages.map(([name, id]) =>
        `<button onclick="show('${id}')">${name}</button>`
      ).join("");

    function list(items) {
      return items.length
        ? items.map(item => `<div class="item">${item}</div>`).join("")
        : '<p class="muted">Nothing added yet.</p>';
    }

    // 2. Dashboard
    function dashboard() {
      const income = data.transactions
        .filter(t => t.type === "Income")
        .reduce((sum, t) => sum + t.amount, 0);

      const spending = data.transactions
        .filter(t => t.type === "Expense")
        .reduce((sum, t) => sum + t.amount, 0);

      const saved = data.savings.reduce(
        (sum, goal) => sum + goal.saved, 0
      );

      document.getElementById("app").innerHTML = `
        <h2>Money Dashboard</h2>
        <div class="grid">
          <div class="card">
            <h3>Monthly budget</h3>
            <p class="stat">${money(data.budget)}</p>
          </div>
          <div class="card">
            <h3>Total expenses</h3>
            <p class="stat">${money(spending)}</p>
          </div>
          <div class="card">
            <h3>Income recorded</h3>
            <p class="stat">${money(income)}</p>
          </div>
          <div class="card">
            <h3>Budget remaining</h3>
            <p class="stat">${money(data.budget - spending)}</p>
          </div>
          <div class="card">
            <h3>Holiday savings</h3>
            <p class="stat">${money(saved)}</p>
          </div>
          <div class="card">
            <h3>Unpaid bills</h3>
            <p class="stat">${data.bills.filter(b => !b.paid).length}</p>
          </div>
        </div>
        <p class="muted">
          Prototype: totals use all recorded transactions.
          Budget remaining is not yet restricted to one month.
        </p>
      `;
    }

    // 3. Personal budget tracker
    function budget() {
      document.getElementById("app").innerHTML = `
        <h2>Budget Tracker</h2>
        <div class="card">
          <h3>Set your budget</h3>
          <input id="budgetLimit" type="number" min="0"
                 value="${data.budget}">
          <button onclick="setBudget()">Save budget</button>
        </div>

        <div class="card">
          <h3>Add a transaction</h3>
          <input id="transactionName" placeholder="e.g. Tesco shopping">
          <input id="transactionAmount" type="number"
                 min="0.01" step="0.01" placeholder="Amount in £">
          <select id="transactionType">
            <option>Expense</option>
            <option>Income</option>
          </select>
          <button onclick="addTransaction()">Add transaction</button>
        </div>

        <div class="card">
          <h3>Transaction history</h3>
          ${list(data.transactions.map(t =>
            `${safe(t.name)} — ${money(t.amount)} (${t.type})`
          ))}
        </div>
      `;
    }

    function setBudget() {
      const value = Number(document.getElementById("budgetLimit").value);
      if (!Number.isFinite(value) || value < 0) return alert("Invalid budget");
      data.budget = value;
      save();
      budget();
    }

    function addTransaction() {
      const name = document.getElementById("transactionName").value.trim();
      const amount = Number(
        document.getElementById("transactionAmount").value
      );
      const type = document.getElementById("transactionType").value;

      if (!name || !validAmount(amount)) return alert("Enter a name and amount");

      data.transactions.push({ name, amount, type });
      save();
      budget();
    }

    // 4. Grocery discounts
    function groceries() {
      document.getElementById("app").innerHTML = `
        <h2>Grocery Discounts & Cashback</h2>
        <div class="card">
          <p>Find supermarket loyalty programmes and offers.</p>
          <p><a href="https://www.tesco.com" target="_blank"
                rel="noopener noreferrer">Tesco</a> — Clubcard</p>
          <p><a href="https://www.sainsburys.co.uk" target="_blank"
                rel="noopener noreferrer">Sainsbury's</a> — Nectar</p>
          <p><a href="https://www.lidl.co.uk" target="_blank"
                rel="noopener noreferrer">Lidl</a> — Lidl Plus</p>
          <p class="muted">
            These are provider links, not verified live deals.
            Cashback transactions are not connected yet.
          </p>
        </div>
      `;
    }

    // 5. Train and flight deal finder
    function travel() {
      document.getElementById("app").innerHTML = `
        <h2>Train & Flight Deals</h2>
        <div class="card">
          <h3>Train tickets</h3>
          <a href="https://www.nationalrail.co.uk" target="_blank"
             rel="noopener noreferrer">National Rail</a>
        </div>
        <div class="card">
          <h3>Flight tickets</h3>
          <a href="https://www.skyscanner.net" target="_blank"
             rel="noopener noreferrer">Skyscanner</a>
        </div>
        <p class="muted">
          Live price comparison requires travel provider APIs.
        </p>
      `;
    }

    // 6. Holiday savings goals
    function holidays() {
      document.getElementById("app").innerHTML = `
        <h2>Holiday Savings</h2>
        <div class="card">
          <h3>Create a holiday goal</h3>
          <input id="goalName" placeholder="e.g. Summer trip to Spain">
          <input id="goalTarget" type="number" min="1"
                 placeholder="Savings target (£)">
          <button onclick="addGoal()">Create goal</button>
        </div>

        ${data.savings.map((g, i) => `
          <div class="card">
            <h3>${safe(g.name)}</h3>
            <p>${money(g.saved)} of ${money(g.target)}</p>
            <div class="progress">
              <div class="fill" style="width:
                ${Math.min(100, 100 * g.saved / g.target)}%">
              </div>
            </div>
            <input id="contribution${i}" type="number" min="0.01"
                   placeholder="Contribution (£)">
            <button onclick="contribute(${i})">Add savings</button>
          </div>
        `).join("")}
      `;
    }

    function addGoal() {
      const name = document.getElementById("goalName").value.trim();
      const target = Number(document.getElementById("goalTarget").value);

      if (!name || !validAmount(target)) return alert("Invalid goal");

      data.savings.push({ name, target, saved: 0 });
      save();
      holidays();
    }

    function contribute(i) {
      const amount = Number(
        document.getElementById("contribution" + i).value
      );

      if (!validAmount(amount)) return alert("Invalid contribution");

      data.savings[i].saved += amount;
      save();
      holidays();
    }

    // 7. Group holidays and shared households
    function groups() {
      document.getElementById("app").innerHTML = `
        <h2>Group Holidays & House Sharing</h2>
        <div class="card">
          <h3>Create a group</h3>
          <input id="groupName" placeholder="e.g. Ibiza Trip">
          <input id="groupMembers"
                 placeholder="Names separated by commas">
          <select id="groupType">
            <option>Holiday</option>
            <option>Household</option>
          </select>
          <button onclick="addGroup()">Create group</button>
        </div>

        ${data.groups.map((g, i) => `
          <div class="card">
            <h3>${safe(g.name)} — ${safe(g.type)}</h3>
            <p>Members: ${g.members.map(safe).join(", ")}</p>
            <h4>Add a shared expense</h4>
            <input id="expenseName${i}" placeholder="e.g. Hotel">
            <input id="expenseAmount${i}" type="number"
                   min="0.01" placeholder="Total (£)">
            <select id="paidBy${i}">
              ${g.members.map(m =>
                `<option value="${safe(m)}">${safe(m)}</option>`
              ).join("")}
            </select>
            <button onclick="addGroupExpense(${i})">Split equally</button>
            <h4>Who owes what?</h4>
            ${list(g.expenses.map(e => {
              const share = e.amount / g.members.length;
              return `${safe(e.name)}: ${money(e.amount)}
                paid by ${safe(e.paidBy)}.
                Each other member owes ${safe(e.paidBy)}
                ${money(share)}.`;
            }))}
          </div>
        `).join("")}

        <p class="muted">
          Groups are saved locally. Real invitations and
          synchronised group accounts are not enabled.
        </p>
      `;
    }

    function addGroup() {
      const name = document.getElementById("groupName").value.trim();
      const members = [...new Set(
        document.getElementById("groupMembers").value
          .split(",").map(m => m.trim()).filter(Boolean)
      )];
      const type = document.getElementById("groupType").value;

      if (!name || members.length < 2) {
        return alert("Enter a group name and at least two members");
      }

      data.groups.push({ name, members, type, expenses: [] });
      save();
      groups();
    }

    function addGroupExpense(i) {
      const name = document.getElementById("expenseName" + i).value.trim();
      const amount = Number(
        document.getElementById("expenseAmount" + i).value
      );
      const paidBy = document.getElementById("paidBy" + i).value;

      if (!name || !validAmount(amount)) return alert("Invalid expense");

      data.groups[i].expenses.push({ name, amount, paidBy });
      save();
      groups();
    }

    // 8. Bill tracker
    function bills() {
      document.getElementById("app").innerHTML = `
        <h2>Bill Tracker</h2>
        <div class="card">
          <input id="billName" placeholder="e.g. Electricity">
          <input id="billAmount" type="number" min="0.01"
                 placeholder="Amount (£)">
          <input id="billDue" type="date">
          <button onclick="addBill()">Add bill</button>
        </div>
        <div class="card">
          <h3>Upcoming & Recorded Bills</h3>
          ${list(data.bills.map((b, i) => `
            ${safe(b.name)} — ${money(b.amount)}
            — due ${safe(b.due)}
            — ${b.paid ? "Paid" : "Unpaid"}
            <button onclick="toggleBill(${i})">
              ${b.paid ? "Mark unpaid" : "Mark paid"}
            </button>
          `))}
        </div>
      `;
    }

    function addBill() {
      const name = document.getElementById("billName").value.trim();
      const amount = Number(document.getElementById("billAmount").value);
      const due = document.getElementById("billDue").value;

      if (!name || !validAmount(amount) || !due) {
        return alert("Complete all bill fields");
      }

      data.bills.push({ name, amount, due, paid: false });
      save();
      bills();
    }

    function toggleBill(i) {
      data.bills[i].paid = !data.bills[i].paid;
      save();
      bills();
    }

    // 9. Skill exchange board
    function skills() {
      document.getElementById("app").innerHTML = `
        <h2>Skill Swap</h2>
        <div class="card">
          <p>Trade knowledge instead of money.</p>
          <input id="skillPerson" placeholder="Your name">
          <input id="skillOffer" placeholder="I can teach...">
          <input id="skillWant" placeholder="I want to learn...">
          <button onclick="addSkill()">Post skill swap</button>
        </div>
        <div class="card">
          ${list(data.skills.map(s =>
            `${safe(s.person)} offers ${safe(s.offer)}
             and wants to learn ${safe(s.want)}`
          ))}
        </div>
      `;
    }

    function addSkill() {
      const person = document.getElementById("skillPerson").value.trim();
      const offer = document.getElementById("skillOffer").value.trim();
      const want = document.getElementById("skillWant").value.trim();

      if (!person || !offer || !want) {
        return alert("Complete all three fields");
      }

      data.skills.push({ person, offer, want });
      save();
      skills();
    }

    // 10. Basic document and bill assistant
    function assistant() {
      document.getElementById("app").innerHTML = `
        <h2>Smart Document Assistant</h2>
        <div class="card">
          <p>Paste text from a bill to identify useful details.</p>
          <textarea id="documentText"
            placeholder="Amount due: £45.50
Due date: 25/11/2026"></textarea>
          <button onclick="analyseDocument()">Analyse text</button>
          <div id="analysisResult"></div>
        </div>
        <p class="muted">
          This is a rule-based prototype, not a live AI agent.
          It cannot read email, navigate websites or submit forms.
        </p>
      `;
    }

    function analyseDocument() {
      const text = document.getElementById("documentText").value;

      const amount = text.match(
        /(?:amount due|total due|total|amount)\s*[:\-]?\s*£\s*(\d[\d,]*\.?\d*)/i
      );

      const date = text.match(
        /(?:due date|payment due)\s*[:\-]?\s*(\d{1,2}\/\d{1,2}\/\d{4})/i
      );

      document.getElementById("analysisResult").innerHTML = `
        <h3>Extracted information</h3>
        <p>Amount: ${amount ? money(amount[1].replaceAll(",", "")) : "Not found"}</p>
        <p>Due date: ${date ? safe(date[1]) : "Not found"}</p>
        <p class="muted">Check all extracted details manually.</p>
      `;
    }

    // 11. Switch between pages
    function show(page) {
      const routes = {
        dashboard, budget, groceries, travel, holidays,
        groups, bills, skills, assistant
      };

      if (routes[page]) routes[page]();
    }

    // Launch the dashboard when the website opens
    show("dashboard");
  </script>
</body>
</html>
