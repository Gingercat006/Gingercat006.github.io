<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f0" />
    <meta name="description" content="A calmer way to manage everyday money, shared plans, and savings." />
    <title>PennyWise — make room for more</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#" aria-label="PennyWise home">
          <span class="brand-mark">P</span>
          <span>Penny<span class="brand-light">Wise</span></span>
        </a>

        <div class="workspace-label">YOUR SPACE</div>
        <nav class="primary-nav" aria-label="Main navigation">
          <button class="nav-link active" data-page="overview"><span class="nav-icon">⌂</span>Overview</button>
          <button class="nav-link" data-page="budget"><span class="nav-icon">◷</span>Budget</button>
          <button class="nav-link" data-page="deals"><span class="nav-icon">✳</span>Deals & rewards<span class="nav-count">4</span></button>
          <button class="nav-link" data-page="trips"><span class="nav-icon">↗️</span>Trips & goals</button>
        </nav>

        <div class="workspace-label group-label">LIFE TOGETHER</div>
        <nav class="primary-nav" aria-label="Shared finances">
          <button class="nav-link" data-page="home"><span class="nav-icon">⌂</span>Shared home</button>
          <button class="nav-link" data-page="owed"><span class="nav-icon">↔️</span>Money owed<span class="nav-count muted-count">2</span></button>
        </nav>

        <div class="sidebar-bottom">
          <button class="ai-sidebar-card" data-page="assistant">
            <span class="ai-spark">✳</span>
            <span><strong>Your money sidekick</strong><small>Little tasks, a little easier.</small></span>
            <span class="side-arrow">↗️</span>
          </button>
          <button class="profile-button">
            <span class="avatar avatar-photo">JD</span>
            <span class="profile-details"><strong>Jamie Davis</strong><small>Personal account</small></span>
            <span class="profile-dots">···</span>
          </button>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <button class="mobile-menu" id="mobile-menu" aria-label="Open navigation">☰</button>
          <div class="breadcrumbs"><span>My space</span><span class="crumb-slash">/</span><strong id="page-crumb">Overview</strong></div>
          <div class="topbar-actions">
            <span class="sync-state"><i></i> Demo workspace</span>
            <button class="icon-button notification-button" aria-label="Notifications">♧<span></span></button>
            <button class="avatar avatar-small">JD</button>
          </div>
        </header>

        <section class="page-content" id="page-content" aria-live="polite"></section>
      </main>
    </div>

    <div class="toast-region" id="toast-region" aria-live="polite"></div>
    <dialog class="modal" id="app-modal">
      <form method="dialog" class="modal-card" id="modal-form">
        <button class="modal-close" value="cancel" aria-label="Close">×</button>
        <div class="modal-eyebrow" id="modal-eyebrow">QUICK ACTION</div>
        <h2 id="modal-title">Add an expense</h2>
        <p class="modal-copy" id="modal-copy">Keep your budget up to date.</p>
        <div id="modal-fields"></div>
        <div class="modal-actions">
          <button class="button button-quiet" value="cancel">Cancel</button>
          <button class="button button-primary" id="modal-submit" value="default">Save</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
